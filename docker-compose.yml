# ===========================================================
# LOCAL DEVELOPMENT COMPOSE FILE
# DO NOT USE FOR STAGING OR PRODUCTION
# ===========================================================

services:
  # ---------------------------------------------------------
  # Laravel (PHP-FPM)
  # ---------------------------------------------------------
  app:
    container_name: petcare_app_local
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    volumes:
      - ./src:/var/www/html
      - storage:/var/www/html/storage/app/public
    depends_on:
      - db
      - redis
    env_file:
      - ./src/.env
    restart: unless-stopped

  # ---------------------------------------------------------
  # Nginx reverse proxy for Laravel
  # ---------------------------------------------------------
  web:
    container_name: petcare_web_local
    image: nginx:1.26-alpine
    ports:
      - '8080:80'
    volumes:
      - ./src:/var/www/html
      - ./docker/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage/app/public
    depends_on:
      - app
    restart: unless-stopped

  # ---------------------------------------------------------
  # MySQL
  # ---------------------------------------------------------
  db:
    container_name: petcare_mysql_local
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-petcare_local}
      MYSQL_USER: ${DB_USERNAME:-petcare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-petcare}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - '3307:3306'
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped

  # ---------------------------------------------------------
  # Redis
  # ---------------------------------------------------------
  redis:
    container_name: petcare_redis_local
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ---------------------------------------------------------
  # Worker (queue)
  # ---------------------------------------------------------
  worker:
    container_name: petcare_worker_local
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./src:/var/www/html
      - ./docker/app/entrypoints/worker.sh:/usr/local/bin/worker.sh:ro
    depends_on:
      - app
      - redis
      - db
    env_file:
      - ./src/.env
    restart: unless-stopped

  # ---------------------------------------------------------
  # Scheduler (cron)
  # ---------------------------------------------------------
  scheduler:
    container_name: petcare_scheduler_local
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - app
    env_file:
      - ./src/.env
    restart: unless-stopped

  # ---------------------------------------------------------
  # UI (React + Vite dev server)
  # ---------------------------------------------------------
  ui:
    container_name: petcare_ui_local
    image: node:20-alpine3.22
    working_dir: /app
    ports:
      - '5173:5173'
    volumes:
      - ./src/ui:/app
    env_file:
      - ./src/ui/.env
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

  # ---------------------------------------------------------
  # PWA (React + Vite dev server)
  # ---------------------------------------------------------
  pwa:
    container_name: petcare_pwa_local
    image: node:20-alpine3.22
    working_dir: /app
    ports:
      - '5174:5174'
    volumes:
      - ./src/pwa:/app
    env_file:
      - ./src/pwa/.env
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

# ---------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------
volumes:
  dbdata:
  redisdata:
  storage:
