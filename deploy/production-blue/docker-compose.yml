name: slightly-better-petcare-production-blue
services:
  app:
    container_name: ${APP_CONTAINER_NAME:-petcare_app_blue}
    image: ${DOCKER_REGISTRY}/petcare-companion-app:${IMAGE_TAG}
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'php artisan migrate:status >/dev/null 2>&1']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    entrypoint: /usr/local/bin/entrypoint.sh
    networks:
      - default
      - shared-db-petcare-production
      - shared-cache-petcare-production
    volumes:
      - .env:/var/www/html/.env
      - ${STORAGE_PATH}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'
      - 'promtail.scrape=true'
      - 'petcare.slot=${SLOT}'

  web:
    container_name: ${WEB_CONTAINER_NAME:-petcare_web_blue}
    image: ${DOCKER_REGISTRY}/petcare-companion-web:${IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - default
      - traefik-proxy
      - shared-db-petcare-production
      - shared-cache-petcare-production
    volumes:
      - .env:/var/www/html/.env
      - ${STORAGE_PATH}:/var/www/html/storage:ro
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'
      - 'promtail.scrape=true'
      - 'petcare.slot=${SLOT}'
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.petcare_web.rule=Host(`${WEB_DOMAIN}`)'
      - 'traefik.http.routers.petcare_web.entrypoints=${TRAEFIK_ENTRYPOINT}'
      - 'traefik.http.routers.petcare_web.tls.certresolver=${TRAEFIK_CERT_RESOLVER}'
      - 'traefik.http.services.petcare_web.loadbalancer.server.port=80'

  ui:
    container_name: ${UI_CONTAINER_NAME:-petcare_ui_blue}
    image: ${DOCKER_REGISTRY}/petcare-companion-ui:${IMAGE_TAG}
    environment:
      API_BASE_URL: https://${WEB_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    networks:
      - default
      - traefik-proxy
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'
      - 'promtail.scrape=true'
      - 'petcare.slot=${SLOT}'
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.petcare_ui.rule=Host(`${UI_DOMAIN}`)'
      - 'traefik.http.routers.petcare_ui.entrypoints=${TRAEFIK_ENTRYPOINT}'
      - 'traefik.http.routers.petcare_ui.tls.certresolver=${TRAEFIK_CERT_RESOLVER}'
      - 'traefik.http.services.petcare_ui.loadbalancer.server.port=80'

  pwa:
    container_name: ${PWA_CONTAINER_NAME:-petcare_pwa_blue}
    image: ${DOCKER_REGISTRY}/petcare-companion-pwa:${IMAGE_TAG}
    environment:
      API_BASE_URL: https://${WEB_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    networks:
      - default
      - traefik-proxy
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'
      - 'promtail.scrape=true'
      - 'petcare.slot=${SLOT}'
      - 'traefik.enable=${TRAEFIK_ENABLE}'
      - 'traefik.http.routers.petcare_pwa.rule=Host(`${PWA_DOMAIN}`)'
      - 'traefik.http.routers.petcare_pwa.entrypoints=${TRAEFIK_ENTRYPOINT}'
      - 'traefik.http.routers.petcare_pwa.tls.certresolver=${TRAEFIK_CERT_RESOLVER}'
      - 'traefik.http.services.petcare_pwa.loadbalancer.server.port=80'

  worker:
    container_name: ${WORKER_CONTAINER_NAME:-petcare_worker_blue}
    image: ${DOCKER_REGISTRY}/petcare-companion-app:${IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /usr/local/bin/worker.sh
    networks:
      - default
      - shared-db-petcare-production
      - shared-cache-petcare-production
    volumes:
      - ${STORAGE_PATH}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'
      - 'promtail.scrape=true'
      - 'petcare.slot=${SLOT}'

  scheduler:
    container_name: ${SCHEDULER_CONTAINER_NAME:-petcare_scheduler_blue}
    image: ${DOCKER_REGISTRY}/petcare-companion-app:${IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /usr/local/bin/scheduler.sh
    networks:
      - default
      - shared-db-petcare-production
      - shared-cache-petcare-production
    volumes:
      - ${STORAGE_PATH}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'
      - 'promtail.scrape=true'
      - 'petcare.slot=${SLOT}'

networks:
  shared-db-petcare-production:
    external: true
  shared-cache-petcare-production:
    external: true
  traefik-proxy:
    external: true
