# Local development only. Production and staging deployments live under /deploy/.

services:
  # Development stack (bind mounts & build contexts)
  app:
    container_name: ${APP_CONTAINER_NAME:-petcare_app_local}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./src:/var/www/html
      - storage:/var/www/html/storage/app/public
    depends_on:
      - db
      - redis
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(0);']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - ./src/.env
    restart: unless-stopped

  web:
    container_name: ${WEB_CONTAINER_NAME:-petcare_web_local}
    image: nginx:1.25-alpine
    volumes:
      - ./src:/var/www/html
      - ./docker/web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage/app/public
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - ./src/.env
    restart: unless-stopped

  db:
    container_name: petcare_mysql_local
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-petcare_local}
      MYSQL_USER: ${DB_USERNAME:-petcare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-petcare}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME:-petcare} -p${DB_PASSWORD:-petcare} || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    container_name: petcare_redis_local
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    container_name: ${WORKER_CONTAINER_NAME:-petcare_worker_local}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    entrypoint: ['sh', '/usr/local/bin/worker.sh']
    environment:
      WAIT_FOR_DB: 'true'
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./src:/var/www/html
      - ./docker/app/entrypoints/worker.sh:/usr/local/bin/worker.sh:ro
    env_file:
      - ./src/.env
    restart: unless-stopped

volumes:
  dbdata:
  redisdata:
  storage:
