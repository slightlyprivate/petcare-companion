name: slightly-better-petcare-staging
services:
  app:
    container_name: ${APP_CONTAINER_NAME:-petcare_app_staging}
    image: ${DOCKER_REGISTRY}/petcare-companion-app:${IMAGE_TAG}
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'php artisan migrate:status >/dev/null 2>&1']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    entrypoint: /usr/local/bin/entrypoint.sh
    networks:
      - default
      - shared-db-petcare-staging
      - shared-cache-petcare-staging
    volumes:
      - .env:/var/www/html/.env
      - ${STORAGE_PATH}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV}'

  web:
    container_name: ${WEB_CONTAINER_NAME:-petcare_web_staging}
    image: ${DOCKER_REGISTRY}/petcare-companion-web:${IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - default
      - traefik-proxy
      - shared-db-petcare-staging
      - shared-cache-petcare-staging
    volumes:
      - .env:/var/www/html/.env
      - ${STORAGE_PATH}:/var/www/html/storage:ro
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV}'
      - 'traefik.enable=true'
      - 'traefik.http.routers.petcare_web_${ENV}.rule=Host(`${WEB_DOMAIN}`)'
      - 'traefik.http.routers.petcare_web_${ENV}.entrypoints=${TRAEFIK_ENTRYPOINT}'
      - 'traefik.http.routers.petcare_web_${ENV}.tls.certresolver=${TRAEFIK_CERT_RESOLVER}'
      - 'traefik.http.services.petcare_web_${ENV}.loadbalancer.server.port=80'

  ui:
    container_name: ${UI_CONTAINER_NAME:-petcare_ui_staging}
    image: ${DOCKER_REGISTRY}/petcare-companion-ui:${IMAGE_TAG}
    environment:
      API_BASE_URL: https://${WEB_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    networks:
      - default
      - traefik-proxy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV}'
      - 'traefik.enable=true'
      - 'traefik.http.routers.petcare_ui_${ENV}.rule=Host(`${UI_DOMAIN}`)'
      - 'traefik.http.routers.petcare_ui_${ENV}.entrypoints=${TRAEFIK_ENTRYPOINT}'
      - 'traefik.http.routers.petcare_ui_${ENV}.tls.certresolver=${TRAEFIK_CERT_RESOLVER}'
      - 'traefik.http.services.petcare_ui_${ENV}.loadbalancer.server.port=80'

  pwa:
    container_name: ${PWA_CONTAINER_NAME:-petcare_pwa_staging}
    image: ${DOCKER_REGISTRY}/petcare-companion-pwa:${IMAGE_TAG}
    environment:
      API_BASE_URL: https://${WEB_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    networks:
      - default
      - traefik-proxy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV}'
      - 'traefik.enable=true'
      - 'traefik.http.routers.petcare_pwa_${ENV}.rule=Host(`${PWA_DOMAIN}`)'
      - 'traefik.http.routers.petcare_pwa_${ENV}.entrypoints=${TRAEFIK_ENTRYPOINT}'
      - 'traefik.http.routers.petcare_pwa_${ENV}.tls.certresolver=${TRAEFIK_CERT_RESOLVER}'
      - 'traefik.http.services.petcare_pwa_${ENV}.loadbalancer.server.port=80'

  worker:
    container_name: ${WORKER_CONTAINER_NAME:-petcare_worker_staging}
    image: ${DOCKER_REGISTRY}/petcare-companion-app:${IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /usr/local/bin/worker.sh
    networks:
      - default
      - shared-db-petcare-staging
      - shared-cache-petcare-staging
    volumes:
      - ${STORAGE_PATH}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV}'

  scheduler:
    container_name: ${SCHEDULER_CONTAINER_NAME:-petcare_scheduler_staging}
    image: ${DOCKER_REGISTRY}/petcare-companion-app:${IMAGE_TAG}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /usr/local/bin/scheduler.sh
    networks:
      - default
      - shared-db-petcare-staging
      - shared-cache-petcare-staging
    volumes:
      - ${STORAGE_PATH}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV}'

networks:
  shared-db-petcare-staging:
    external: true
  shared-cache-petcare-staging:
    external: true
  traefik-proxy:
    external: true
