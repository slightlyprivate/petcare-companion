services:
  app:
    container_name: ${APP_CONTAINER_NAME:-petcare_app_blue}
    image: ${DOCKER_REGISTRY:-ghcr.io/slightlyprivate}/petcare-companion-app:${IMAGE_TAG:-release-latest}
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'php artisan migrate:status >/dev/null 2>&1']
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    entrypoint: /usr/local/bin/entrypoint.sh
    networks:
      - default
      - shared-db-petcare
      - shared-cache-petcare
    volumes:
      - .env:/var/www/html/.env
      - ${STORAGE_PATH:-/mnt/data/appdata/petcare-storage-prod}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV:-prod}'
      - 'petcare.slot=${SLOT:-blue}'

  web:
    container_name: ${WEB_CONTAINER_NAME:-petcare_web_blue}
    image: ${DOCKER_REGISTRY:-ghcr.io/slightlyprivate}/petcare-companion-web:${IMAGE_TAG:-release-latest}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - default
      - traefik-proxy
    volumes:
      - .env:/var/www/html/.env
      - ${STORAGE_PATH:-/mnt/data/appdata/petcare-storage-prod}:/var/www/html/storage:ro
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV:-prod}'
      - 'petcare.slot=${SLOT:-blue}'
      - 'traefik.enable=${TRAEFIK_ENABLE:-false}'
      - 'traefik.http.routers.petcare_web_${ENV:-prod}_${SLOT:-blue}.rule=Host(`${WEB_DOMAIN:-petcare.web.ubuntu.slightlyprivate.com}`)'
      - 'traefik.http.routers.petcare_web_${ENV:-prod}_${SLOT:-blue}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
      - 'traefik.http.routers.petcare_web_${ENV:-prod}_${SLOT:-blue}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cfresolver}'
      - 'traefik.http.services.petcare_web_${ENV:-prod}_${SLOT:-blue}.loadbalancer.server.port=80'

  ui:
    container_name: ${UI_CONTAINER_NAME:-petcare_ui_blue}
    image: ${DOCKER_REGISTRY:-ghcr.io/slightlyprivate}/petcare-companion-ui:${IMAGE_TAG:-release-latest}
    environment:
      API_BASE_URL: https://${WEB_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    networks:
      - default
      - traefik-proxy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV:-prod}'
      - 'petcare.slot=${SLOT:-blue}'
      - 'traefik.enable=${TRAEFIK_ENABLE:-false}'
      - 'traefik.http.routers.petcare_ui_${ENV:-prod}_${SLOT:-blue}.rule=Host(`${UI_DOMAIN:-petcare.ui.ubuntu.slightlyprivate.com}`)'
      - 'traefik.http.routers.petcare_ui_${ENV:-prod}_${SLOT:-blue}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
      - 'traefik.http.routers.petcare_ui_${ENV:-prod}_${SLOT:-blue}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cfresolver}'
      - 'traefik.http.services.petcare_ui_${ENV:-prod}_${SLOT:-blue}.loadbalancer.server.port=80'

  pwa:
    container_name: ${PWA_CONTAINER_NAME:-petcare_pwa_blue}
    image: ${DOCKER_REGISTRY:-ghcr.io/slightlyprivate}/petcare-companion-pwa:${IMAGE_TAG:-release-latest}
    environment:
      API_BASE_URL: https://${WEB_DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
    networks:
      - default
      - traefik-proxy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV:-prod}'
      - 'petcare.slot=${SLOT:-blue}'
      - 'traefik.enable=${TRAEFIK_ENABLE:-false}'
      - 'traefik.http.routers.petcare_pwa_${ENV:-prod}_${SLOT:-blue}.rule=Host(`${PWA_DOMAIN:-petcare.pwa.ubuntu.slightlyprivate.com}`)'
      - 'traefik.http.routers.petcare_pwa_${ENV:-prod}_${SLOT:-blue}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
      - 'traefik.http.routers.petcare_pwa_${ENV:-prod}_${SLOT:-blue}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cfresolver}'
      - 'traefik.http.services.petcare_pwa_${ENV:-prod}_${SLOT:-blue}.loadbalancer.server.port=80'

  worker:
    container_name: ${WORKER_CONTAINER_NAME:-petcare_worker_blue}
    image: ${DOCKER_REGISTRY:-ghcr.io/slightlyprivate}/petcare-companion-app:${IMAGE_TAG:-release-latest}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /usr/local/bin/worker.sh
    networks:
      - default
      - shared-db-petcare
      - shared-cache-petcare
    volumes:
      - ${STORAGE_PATH:-/mnt/data/appdata/petcare-storage-prod}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV:-prod}'
      - 'petcare.slot=${SLOT:-blue}'

  scheduler:
    container_name: ${SCHEDULER_CONTAINER_NAME:-petcare_scheduler_blue}
    image: ${DOCKER_REGISTRY:-ghcr.io/slightlyprivate}/petcare-companion-app:${IMAGE_TAG:-release-latest}
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: /usr/local/bin/scheduler.sh
    networks:
      - default
      - shared-db-petcare
      - shared-cache-petcare
    volumes:
      - ${STORAGE_PATH:-/mnt/data/appdata/petcare-storage-prod}:/var/www/html/storage
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
      - 'promtail.scrape=true'
      - 'petcare.env=${ENV:-prod}'
      - 'petcare.slot=${SLOT:-blue}'

networks:
  shared-db-petcare:
    external: true
  shared-cache-petcare:
    external: true
  traefik-proxy:
    external: true
