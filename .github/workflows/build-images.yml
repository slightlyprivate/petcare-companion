name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'src/**'
      - 'docker-bake.hcl'
      - 'VERSION'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # REQUIRED for SARIF upload

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/slightlyprivate/petcare-companion-app
            ghcr.io/slightlyprivate/petcare-companion-web
            ghcr.io/slightlyprivate/petcare-companion-ui
            ghcr.io/slightlyprivate/petcare-companion-pwa
          labels: false

      - name: Read version and set build info
        id: version
        run: |
          VERSION=$(cat VERSION)
          SHORT_SHA=${GITHUB_SHA::7}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "app_version=${VERSION}+${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push images
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          targets: all
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            ui.args.VITE_APP_VERSION=${{ steps.version.outputs.app_version }}
            pwa.args.VITE_APP_VERSION=${{ steps.version.outputs.app_version }}
            app.tags=ghcr.io/slightlyprivate/petcare-companion-app:staging-${{ steps.version.outputs.version }}
            app.tags+=ghcr.io/slightlyprivate/petcare-companion-app:staging
            app.tags+=ghcr.io/slightlyprivate/petcare-companion-app:release-${{ steps.version.outputs.version }}
            web.tags=ghcr.io/slightlyprivate/petcare-companion-web:staging-${{ steps.version.outputs.version }}
            web.tags+=ghcr.io/slightlyprivate/petcare-companion-web:staging
            web.tags+=ghcr.io/slightlyprivate/petcare-companion-web:release-${{ steps.version.outputs.version }}
            ui.tags=ghcr.io/slightlyprivate/petcare-companion-ui:staging-${{ steps.version.outputs.version }}
            ui.tags+=ghcr.io/slightlyprivate/petcare-companion-ui:staging
            ui.tags+=ghcr.io/slightlyprivate/petcare-companion-ui:release-${{ steps.version.outputs.version }}
            pwa.tags=ghcr.io/slightlyprivate/petcare-companion-pwa:staging-${{ steps.version.outputs.version }}
            pwa.tags+=ghcr.io/slightlyprivate/petcare-companion-pwa:staging
            pwa.tags+=ghcr.io/slightlyprivate/petcare-companion-pwa:release-${{ steps.version.outputs.version }}

      - name: Add build summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const images = [
              { name: "petcare-companion-app", image: "ghcr.io/slightlyprivate/petcare-companion-app" },
              { name: "petcare-companion-web", image: "ghcr.io/slightlyprivate/petcare-companion-web" },
              { name: "petcare-companion-ui", image: "ghcr.io/slightlyprivate/petcare-companion-ui" },
              { name: "petcare-companion-pwa", image: "ghcr.io/slightlyprivate/petcare-companion-pwa" },
            ];
            const version = '${{ steps.version.outputs.version }}';
            const appVersion = '${{ steps.version.outputs.app_version }}';
            const isMain = '${{ github.ref }}' === 'refs/heads/main';
            const platforms = 'linux/amd64 (fast build)';
            let summary = `## Docker Build Summary\n\n`;
            summary += `**Version:** \`${version}\`\n`;
            summary += `**App Version (displayed in UI):** \`${appVersion}\`\n\n`;
            summary += `**Platforms:** ${platforms}\n`;
            summary += `**Build Type:** Staging build (amd64 only)\n\n`;
            summary += `For multi-arch releases, trigger the \`release-multiarch.yml\` workflow manually.\n\n`;
            summary += `| Image | Tags |\n|-------|------|\n`;
            for (const img of images) {
              const tags = [
                `${img.image}:staging-${version}`,
                `${img.image}:release-${version}`,
              ];
              summary += `| \`${img.image}\` | ${tags.map(t => `\`${t}\``).join(', ')} |\n`;
            }
            summary += `\n✅ **Build and push completed successfully.**\n`;
            await core.summary.addRaw(summary).write();

      - name: Validate image sizes
        run: |
          set -e
          APP_IMAGE="ghcr.io/slightlyprivate/petcare-companion-app:${{ steps.version.outputs.version }}"
          WEB_IMAGE="ghcr.io/slightlyprivate/petcare-companion-web:${{ steps.version.outputs.version }}"
          UI_IMAGE="ghcr.io/slightlyprivate/petcare-companion-ui:${{ steps.version.outputs.version }}"
          PWA_IMAGE="ghcr.io/slightlyprivate/petcare-companion-pwa:${{ steps.version.outputs.version }}"
          APP_LIMIT=$((450 * 1024 * 1024))
          WEB_LIMIT=$((50 * 1024 * 1024))
          UI_LIMIT=$((150 * 1024 * 1024))
          PWA_LIMIT=$((80 * 1024 * 1024))

          APP_SIZE=$(docker image inspect $APP_IMAGE --format='{{.Size}}' || echo 0)
          WEB_SIZE=$(docker image inspect $WEB_IMAGE --format='{{.Size}}' || echo 0)
          UI_SIZE=$(docker image inspect $UI_IMAGE --format='{{.Size}}' || echo 0)
          PWA_SIZE=$(docker image inspect $PWA_IMAGE --format='{{.Size}}' || echo 0)

          if [ "$APP_SIZE" -gt "$APP_LIMIT" ]; then
            echo "::warning::App image size ($((APP_SIZE/1024/1024))MB) exceeds 450MB"
          else
            echo "App image size: $((APP_SIZE/1024/1024))MB"
          fi

          if [ "$WEB_SIZE" -gt "$WEB_LIMIT" ]; then
            echo "::warning::Web image size ($((WEB_SIZE/1024/1024))MB) exceeds 50MB"
          else
            echo "Web image size: $((WEB_SIZE/1024/1024))MB"
          fi

          if [ "$UI_SIZE" -gt "$UI_LIMIT" ]; then
            echo "::warning::UI image size ($((UI_SIZE/1024/1024))MB) exceeds 150MB"
          else
            echo "UI image size: $((UI_SIZE/1024/1024))MB"
          fi

          if [ "$PWA_SIZE" -gt "$PWA_LIMIT" ]; then
            echo "::warning::PWA image size ($((PWA_SIZE/1024/1024))MB) exceeds 80MB"
          else
            echo "PWA image size: $((PWA_SIZE/1024/1024))MB"
          fi

      ###############################################################
      # 🔥 NEW: Trivy scan for vulnerabilities (SARIF upload)
      ###############################################################

      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ghcr.io/slightlyprivate/petcare-companion-web:staging-${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-web.sarif
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload SARIF (web)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      # OPTIONAL: Scan app
      - name: Trivy scan (app)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ghcr.io/slightlyprivate/petcare-companion-app:staging-${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-app.sarif
          ignore-unfixed: false

      - name: Upload SARIF (app)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-app.sarif
          category: trivy-app

      # OPTIONAL: Scan Utility UI
      - name: Trivy scan (ui)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ghcr.io/slightlyprivate/petcare-companion-ui:staging-${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-ui.sarif
          ignore-unfixed: false

      - name: Upload SARIF (ui)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-ui.sarif
          category: trivy-ui

      # OPTIONAL: Scan PWA
      - name: Trivy scan (pwa)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ghcr.io/slightlyprivate/petcare-companion-pwa:staging-${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-pwa.sarif
          ignore-unfixed: false

      - name: Upload SARIF (pwa)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-pwa.sarif
          category: trivy-pwa
